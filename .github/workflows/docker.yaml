name: Docker (skopeo 流式同步，几乎不占磁盘)

# 备选方案：用 skopeo 直接把镜像从上游 registry 流式复制到阿里云 ACR，
# 全程不落盘解压镜像层，磁盘占用只有几十 MB 的临时缓冲，
# 从根本上告别 No space left on device，也省掉 maximize-build-space 这一整套操作。
# 代价：不经过本地 docker daemon，无法在中间做 docker run / 改层之类的操作。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 需要保留多架构（manifest list）时改成 true
  COPY_ALL_PLATFORMS: "false"
  # Docker Hub 匿名拉取有速率限制，建议配 DOCKERHUB_USER / DOCKERHUB_PASSWORD
  DOCKERHUB_USER: "${{ secrets.DOCKERHUB_USER }}"
  DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_PASSWORD }}"

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update -y
        sudo apt-get install -y skopeo
        skopeo --version
        df -hT

    - name: Sync images to Aliyun
      run: |
        if [ ! -s images.txt ]; then
          echo "images.txt 不存在或为空，退出"
          exit 1
        fi

        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            echo "$line" | grep -q '^\s*#' && continue

            image=$(echo "$line" | sed -E 's/--platform[[:space:]]+[^[:space:]]+//g' | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]}" && "${temp_map[$image_name]}" != "$name_space" ]]; then
                duplicate_images[$image_name]="true"
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt

        total=0; ok=0; failed_list=""

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            echo "$line" | grep -q '^\s*#' && continue
            total=$((total+1))

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | sed -E 's/--platform[[:space:]]+[^[:space:]]+//g' | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" && -n "${name_space}" ]]; then
                name_space_prefix="${name_space}_"
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            # 源端凭证（Docker Hub 可留空走匿名）
            src_auth=()
            if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
                src_auth=(--src-creds "$DOCKERHUB_USER:$DOCKERHUB_PASSWORD")
            fi

            # 只同步指定架构时用 --override-os/--override-arch，全架构用 --all
            plat_args=()
            if [ "$COPY_ALL_PLATFORMS" = "true" ]; then
                plat_args=(--all)
            elif [ -n "$platform" ]; then
                plat_args=(--override-os linux --override-arch "${platform#*/}")
            fi

            echo "skopeo copy docker://$image -> docker://$new_image"
            if skopeo copy \
                --preserve-digests \
                "${plat_args[@]}" \
                "${src_auth[@]}" \
                --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
                "docker://$image" "docker://$new_image"; then
                ok=$((ok+1))
            else
                echo "::warning::同步失败 $image"
                failed_list="$failed_list\n$image"
            fi

            df -hT | tail -n 2
        done < images.txt

        echo "同步完成：共 $total 个，成功 $ok 个"
        if [ -n "$failed_list" ]; then
            echo "失败清单："; echo -e "$failed_list"; exit 1
        fi
